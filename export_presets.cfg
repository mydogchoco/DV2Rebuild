[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; ⚠️ Godot 은 **임포트되지 않는 파일**(.json 등 순수 텍스트)을 리소스로 보지 않아
;   include_filter 에 적지 않으면 pck 에 들어가지 않는다. 우리 런타임이 FileAccess 로
;   직접 읽는 것은 두 갈래뿐이다:
;     data/**.json            = 마스터 데이터(서버 DB 대체) — data_loader.gd
;     assets/converted/**.json = 아틀라스 _manifest.json(논리키→프레임) · 파티클 · 스파인 메타
;   ⚠️ 통짜 `*.json` 은 쓰지 않는다 — 필터는 .gdignore 를 무시하고 걷기 때문에
;      DV2/converted/*.json(원본 반입분 수만 개)까지 빨아들인다.
; `admin.local` = 관리자 모드 로컬 표식(gitignore, `UserDB.ADMIN_LOCAL_FLAG`).
;   여기 없으면 pck 에 안 실려서 **exe 에서만 관리자 모드가 꺼진다**(에디터 실행은 켜지고).
;   레포에는 파일 자체가 없으니 클론본 빌드에서는 이 줄이 아무것도 걸지 않는다.
include_filter="data/*.json,data/text/*.json,assets/converted/*.json,admin.local"
; 개발 전용 산출물 — 검증 창(dev_*/test_*/shot_*/_tmp_*)과 스크래치 캡처, 파이썬 도구.
; `res/*` = 원작 APK 의 안드로이드 AppCompat 드로어블(577장). 코드가 한 장도 참조하지
;   않는데 Godot 이 임포트해 버려 pck 에 실린다(.gitignore 도 같은 이유로 빼 둔 폴더다).
exclude_filter="scratch_shots/*,scripts/tools/fixtures/*,scripts/tools/*.py,scenes/dev_*.tscn,scenes/test_*.tscn,scenes/shot_*.tscn,scenes/_tmp_*.tscn,scenes/_test_*.tscn,scenes/demo.tscn,scenes/view_loki.tscn,docs/*,res/*"
export_path="export/windows/DragonVillage2.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
; 단일 exe. pck 를 실행 파일 안에 넣는다(🟦 사용자 확정) — 배포물이 파일 하나가 되고
; exe 만 옮겨도 게임이 돈다. 대신 exe 가 1GB 대가 되고 빌드가 조금 느리다.
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
; 프로그램(exe) 아이콘 — 원작 앱 아이콘 icon.png 를 7사이즈 멀티 ico 로 구운 것.
;   재생성: python -c "from PIL import Image; im=Image.open('icon.png').convert('RGBA'); \
;     im.save('icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(24,24),(16,16)])"
application/icon="res://icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name=""
application/product_name="DragonVillage2 Offline"
application/file_description="드래곤빌리지2 오프라인 재구현 (개인 소장용)"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\\{archive_name}' -DestinationPath '{temp_dir}'
$action = New-ScheduledTaskAction -Execute '{temp_dir}\\{exe_name}' -Argument '{cmd_args}'
$trigger = New-ScheduledTaskTrigger -Once -At 00:00
$settings = New-ScheduledTaskSettingsSet
$task = New-ScheduledTask -Action $action -Trigger $trigger -Settings $settings
Register-ScheduledTask godot_remote_debug -InputObject $task -Force:$true
Start-ScheduledTask -TaskName godot_remote_debug
while (Get-ScheduledTask -TaskName godot_remote_debug | ? State -eq running) { Start-Sleep -Milliseconds 100 }
Unregister-ScheduledTask -TaskName godot_remote_debug -Confirm:$false -ErrorAction:SilentlyContinue"
ssh_remote_deploy/cleanup_script="Stop-ScheduledTask -TaskName godot_remote_debug -ErrorAction:SilentlyContinue
Unregister-ScheduledTask -TaskName godot_remote_debug -Confirm:$false -ErrorAction:SilentlyContinue
Remove-Item -Recurse -Force '{temp_dir}'"

; 리팩토링한 코드가 그대로 빌드·실행되는지 확인하는 **검증용 빌드**.
; 기존 exe 를 건드리지 않도록 산출 경로를 따로 두고, 커스텀 기능 `verifybuild` 를 단다.
; 그 기능이 붙은 실행만 세이브를 `user://verify_save/` 로 보낸다
; (`scripts/core/save_system.gd` VERIFY_DIR) — 기존 세이브는 열지도 않는다.
[preset.1]

name="Windows Verify"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="verifybuild"
export_filter="all_resources"
